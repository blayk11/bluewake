name: Build iOS App com ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'URL de download direto da ISO do jogo'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Listar arquivos do repositório
        run: |
          echo "Estrutura de pastas raiz:"
          ls -la

      - name: Baixar a ISO do jogo
        run: |
          echo "Baixando a ISO..."
          curl -L "${{ github.event.inputs.iso_url }}" -o game_iso.iso

      - name: Executar build e gerar IPA
        run: |
          echo "Preparando ambiente para compilação..."
          # Se o projeto tiver subpastas, entramos nelas se necessário, ou rodamos o build padrão
          # Exemplo: python3 -m pip install -r requirements.txt (se for script Python)
          
          # Verificando se existe package.json em alguma pasta interna
          find . -name "package.json"
          
          # Adicione o comando correto de build do projeto aqui após testarmos a estrutura

      - name: Salvar o .ipa gerado
        uses: actions/upload-artifact@v4
        with:
          name: bluewake-custom-ipa
          path: '**/*.ipa'
