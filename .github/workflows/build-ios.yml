name: Build iOS App com ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'URL de download direto da ISO do jogo'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar a ISO do jogo
        run: |
          echo "Baixando a ISO..."
          curl -L "${{ github.event.inputs.iso_url }}" -o game_iso.iso

      - name: Executar preparação e build com a ISO
        run: |
          echo "Iniciando scripts de preparação..."
          # Executa o script de preparação do projeto apontando para a ISO baixada
          python3 scripts/prepare.py --iso game_iso.iso || python3 scripts/prepare.py
          
          # Se houver outro passo de compilação necessário, ele rodará aqui
          echo "Procurando arquivos .ipa gerados..."
          find . -name "*.ipa"

      - name: Salvar o .ipa gerado
        uses: actions/upload-artifact@v4
        with:
          name: bluewake-custom-ipa
          path: '**/*.ipa'
          if-no-files-found: ignore
