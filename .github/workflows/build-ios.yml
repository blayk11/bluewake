name: Build iOS App com ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'URL de download direto da ISO do jogo'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Baixar a ISO do jogo
        run: |
          echo "Baixando a ISO..."
          curl -L "${{ github.event.inputs.iso_url }}" -o game_iso.iso

      - name: Procurar scripts de build no projeto
        run: |
          echo "Procurando arquivos de compilação ou scripts Python/Shell..."
          find . -maxdepth 2 -name "*.py" -o -name "*.sh" -o -name "Makefile"

      - name: Salvar o .ipa gerado (Placeholder)
        uses: actions/upload-artifact@v4
        with:
          name: bluewake-custom-ipa
          path: '**/*.ipa'
          if-no-files-found: ignore
